<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>应用详情 - AI能力开放平台</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="content-page">
  <div class="page-container">
    <div class="content-card">
      <!-- Header with back and actions -->
      <div class="page-header" style="padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--color-border);">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: var(--space-4);">
            <button class="admin-btn admin-btn-ghost" id="btn-back" style="padding: var(--space-2);">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div>
              <h1 class="page-title" id="app-name" style="margin: 0;">应用详情</h1>
            </div>
          </div>
          <div style="display: flex; gap: var(--space-3);">
            <button class="admin-btn admin-btn-secondary" id="btn-edit">
              <i class="fa-solid fa-pen"></i> 编辑
            </button>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div id="app-content" style="padding: var(--space-6);">
        <!-- Loading -->
        <div class="admin-loading" id="loading">
          <i class="fa-solid fa-spinner fa-spin"></i>
          <span>加载中...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="../../assets/js/mock-loader.js"></script>
  <script src="../../assets/js/agent.js"></script>
  <script src="../../assets/js/application-store.js"></script>
  <script>
    // Get app ID from URL
    function getAppId() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    // Load app data
    function loadApp(id) {
      return ApplicationStore.get(id);
    }

    // Save app data
    function saveApp(app) {
      ApplicationStore.upsert(app);
    }

    // Generate random string
    function generateRandomString(length) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    // 可授权 Agent(已上架且未授权)
    function grantOptions(app) {
      const granted = (app.authorizedAgents || [])
        .filter(a => a.status === 'approved')
        .map(a => a.agentId);
      const agents = (typeof AgentStore !== 'undefined')
        ? AgentStore.list().filter(a => a.status === 'published' && !granted.includes(a.id))
        : [];
      return agents.length
        ? agents.map(a => `<option value="${a.id}">${a.name} (${a.version || '-'})</option>`).join('')
        : '<option value="">全部已上架 Agent 均已授权</option>';
    }

    // 添加授权
    function grantAgent(appId) {
      const sel = document.getElementById('grant-select');
      if (!sel || !sel.value) {
        showToast('请选择要授权的 Agent(能力)', 'error');
        return;
      }
      ApplicationStore.grant(appId, sel.value);
      showToast('授权成功');
      renderDetail(loadApp(appId));
    }

    // 撤销授权
    function revokeAgentGrant(appId, agentId) {
      if (!confirm('确定撤销该 Agent(能力)授权吗？')) return;
      ApplicationStore.revoke(appId, agentId);
      showToast('已撤销授权');
      renderDetail(loadApp(appId));
    }

    // Render app detail
    function renderDetail(app) {
      const content = document.getElementById('app-content');
      const loadingEl = document.getElementById('loading');
      if (loadingEl) loadingEl.style.display = 'none';
      const nameEl = document.getElementById('app-name');
      if (nameEl) nameEl.textContent = app.name;

      const statusText = app.status === 'active' ? '正常' : '停用';
      const statusClass = app.status === 'active' ? 'admin-status-active' : 'admin-status-inactive';

      content.innerHTML = `
        <!-- Basic Info Section -->
        <div style="margin-bottom: var(--space-6);">
          <h3 style="font-size: var(--font-size-md); font-weight: 600; color: var(--color-text-primary); margin: 0 0 var(--space-4) 0; display: flex; align-items: center; gap: var(--space-2);">
            <i class="fa-solid fa-info-circle" style="color: var(--color-primary);"></i>
            基本信息
          </h3>
          <div style="background: var(--color-bg); border-radius: var(--radius-lg); padding: var(--space-5);">
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4);">
              <div class="detail-item">
                <div class="detail-label">应用名称</div>
                <div class="detail-value">${app.name}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">应用编码</div>
                <div class="detail-value"><code style="font-size: 13px; background: var(--color-surface); padding: 2px 8px; border-radius: 4px;">${app.code}</code></div>
              </div>
              <div class="detail-item">
                <div class="detail-label">应用类型</div>
                <div class="detail-value"><span class="tag tag-outline">${app.type}</span></div>
              </div>
              <div class="detail-item">
                <div class="detail-label">状态</div>
                <div class="detail-value">
                  <span class="admin-status ${statusClass}">
                    <span class="admin-status-dot"></span>
                    ${statusText}
                  </span>
                </div>
              </div>
              <div class="detail-item" style="grid-column: span 2;">
                <div class="detail-label">应用描述</div>
                <div class="detail-value" style="color: var(--color-text-secondary);">${app.description || '-'}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">创建时间</div>
                <div class="detail-value">${app.createTime}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">最近调用</div>
                <div class="detail-value">${app.lastCall || '-'}</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Access Info Section -->
        <div style="margin-bottom: var(--space-6);">
          <h3 style="font-size: var(--font-size-md); font-weight: 600; color: var(--color-text-primary); margin: 0 0 var(--space-4) 0; display: flex; align-items: center; gap: var(--space-2);">
            <i class="fa-solid fa-key" style="color: var(--color-primary);"></i>
            接入信息
          </h3>
          <div style="background: var(--color-bg); border-radius: var(--radius-lg); padding: var(--space-5);">
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4);">
              <div class="detail-item">
                <div class="detail-label">接入方式</div>
                <div class="detail-value">API</div>
              </div>
              <div class="detail-item"></div>
              <div class="detail-item">
                <div class="detail-label">Client ID</div>
                <div style="display: flex; align-items: center; gap: var(--space-2);">
                  <code id="client-id-display" style="font-size: 13px; background: var(--color-surface); padding: 4px 8px; border-radius: 4px; flex: 1; overflow: hidden; text-overflow: ellipsis;">${app.clientId}</code>
                  <button class="admin-btn admin-btn-ghost" onclick="copyToClipboard('${app.clientId}', 'Client ID')" title="复制" style="padding: var(--space-2);">
                    <i class="fa-solid fa-copy"></i>
                  </button>
                </div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Client Secret</div>
                <div style="display: flex; align-items: center; gap: var(--space-2);">
                  <code id="client-secret-display" style="font-size: 13px; background: var(--color-surface); padding: 4px 8px; border-radius: 4px; flex: 1; overflow: hidden; text-overflow: ellipsis; letter-spacing: 2px;">
                    ${app.secretVisible ? app.clientSecret : '••••••••••••••••'}
                  </code>
                  <button class="admin-btn admin-btn-ghost" onclick="toggleSecretVisibility()" title="${app.secretVisible ? '隐藏' : '显示'}" style="padding: var(--space-2);" id="toggle-secret-btn">
                    <i class="fa-solid ${app.secretVisible ? 'fa-eye-slash' : 'fa-eye'}"></i>
                  </button>
                  <button class="admin-btn admin-btn-ghost" onclick="copyToClipboard('${app.clientSecret}', 'Client Secret')" title="复制" style="padding: var(--space-2);">
                    <i class="fa-solid fa-copy"></i>
                  </button>
                </div>
              </div>
              <div class="detail-item" style="grid-column: span 2;">
                <button class="admin-btn admin-btn-secondary" onclick="regenerateCredentials()">
                  <i class="fa-solid fa-rotate"></i> 重新生成凭证
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Authorized Agents Section (Agent 即能力) -->
        <div>
          <h3 style="font-size: var(--font-size-md); font-weight: 600; color: var(--color-text-primary); margin: 0 0 var(--space-4) 0; display: flex; align-items: center; gap: var(--space-2);">
            <i class="fa-solid fa-handshake" style="color: var(--color-primary);"></i>
            已授权能力(Agent)
          </h3>
          <div style="background: var(--color-bg); border-radius: var(--radius-lg); padding: var(--space-5);">
            ${(app.authorizedAgents || []).length > 0 ? `
              <div style="display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4);">
                ${(app.authorizedAgents || []).map(a => {
                  const agent = (typeof AgentStore !== 'undefined') ? AgentStore.get(a.agentId) : null;
                  const name = agent ? agent.name : a.agentId;
                  const revoked = a.status !== 'approved';
                  return `<span class="tag ${revoked ? 'tag-outline' : 'tag-success'}" style="padding: var(--space-2) var(--space-3); display: inline-flex; align-items: center; gap: 6px;">
                    ${name} ${revoked ? '(已撤销)' : ''}
                    <i class="fa-solid fa-xmark" style="cursor: pointer; color: var(--color-text-muted);" title="撤销授权" onclick="revokeAgentGrant('${app.id}','${a.agentId}')"></i>
                  </span>`;
                }).join('')}
              </div>` : `
              <div style="margin-bottom: var(--space-4); color: var(--color-text-muted);">暂无授权能力</div>`}
            <div style="display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center;">
              <select id="grant-select" class="admin-form-select" style="max-width: 300px;">
                ${grantOptions(app)}
              </select>
              <button class="admin-btn admin-btn-primary" onclick="grantAgent('${app.id}')">
                <i class="fa-solid fa-plus"></i> 添加授权
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Toggle secret visibility
    function toggleSecretVisibility() {
      const appId = getAppId();
      const app = loadApp(appId);
      if (!app) return;

      app.secretVisible = !app.secretVisible;
      saveApp(app);
      renderDetail(app);
    }

    // Copy to clipboard
    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label}已复制`);
      }).catch(() => {
        showToast('复制失败', 'error');
      });
    }

    // Regenerate credentials
    function regenerateCredentials() {
      const appId = getAppId();
      const app = loadApp(appId);
      if (!app) return;

      if (!confirm('确定要重新生成凭证吗？重新生成后旧的凭证将立即失效。')) return;

      app.clientId = 'app_' + generateRandomString(16);
      app.clientSecret = 'app_' + generateRandomString(32);
      app.secretVisible = false;
      saveApp(app);

      showToast('凭证已重新生成');
      renderDetail(app);
    }

    // Go back
    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'navigate', url: 'app.html' }, '*');
      } else {
        window.location.href = 'app.html';
      }
    }

    // Edit app
    function editApp() {
      const appId = getAppId();
      if (window.parent !== window) {
        window.parent.postMessage({ type: 'navigate', url: `app-create.html?id=${appId}` }, '*');
      } else {
        window.location.href = `app-create.html?id=${appId}`;
      }
    }

    // Show toast
    function showToast(message, type) {
      type = type || 'success';
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'admin-toast admin-toast-' + type;
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-circle-exclamation';
      toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('active'));
      setTimeout(() => {
        toast.classList.remove('active');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Event bindings
    document.getElementById('btn-back').addEventListener('click', goBack);
    document.getElementById('btn-edit').addEventListener('click', editApp);

    // Menu highlight
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'menuHighlight', url: 'app.html' }, '*');
    }

    // Init
    window.addEventListener('load', () => {
      const appId = getAppId();
      if (!appId) {
        document.getElementById('loading').innerHTML = '<div class="admin-empty-state"><div class="empty-state-icon"><i class="fa-solid fa-exclamation-triangle"></i></div><div class="empty-state-title">无效的应用ID</div></div>';
        return;
      }

      const app = loadApp(appId);
      if (!app) {
        document.getElementById('loading').innerHTML = '<div class="admin-empty-state"><div class="empty-state-icon"><i class="fa-solid fa-search"></i></div><div class="empty-state-title">应用不存在</div></div>';
        return;
      }

      renderDetail(app);
    });
  </script>

  <style>
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .detail-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
      font-weight: var(--font-weight-medium);
    }
    .detail-value {
      font-size: var(--font-size-sm);
      color: var(--color-text-primary);
    }
  </style>
</body>
</html>
